name: Update README

on:
  schedule:
    - cron: "23 3 * * *" # nightly 03:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update-readme.mjs]

concurrency:
  group: update-readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh README"
          git pull --rebase --autostash
          git push
